name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-check:
    name: Rust Check (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --all-targets

      - name: Run newhall-core tests without default features
        run: cargo test -p newhall-core --no-default-features

      - name: Check vendored newhall-core sync
        run: bash r-pkg/tools/sync-core.sh --check

  rust-cross:
    name: Rust Cross-Platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run workspace tests
        run: cargo test --workspace --all-targets

  r-check:
    name: R Package Check (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install terra system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libsqlite3-dev \
            libudunits2-dev

      - name: Install R package dependencies
        run: Rscript -e "install.packages(c('testthat', 'terra', 'devtools'))"

      - name: Build R source package
        run: R CMD build r-pkg

      - name: Check R source package
        env:
          _R_CHECK_FORCE_SUGGESTS_: "false"
        run: R CMD check --no-manual newhallrs_*.tar.gz

      - name: Run testthat suite
        run: Rscript -e "devtools::test('r-pkg')"
