name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  version-check:
    name: Version Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify tag matches package versions
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          status=0
          check() {
            local file="$1" found="$2"
            if [ "$found" != "$tag_version" ]; then
              echo "::error file=$file::Version mismatch: $file has '$found', tag ${GITHUB_REF_NAME} expects '$tag_version'"
              status=1
            else
              echo "OK: $file = $found"
            fi
          }
          cargo_version() {
            grep -m1 '^version' "$1" | sed -E 's/.*"(.*)".*/\1/'
          }
          check crates/newhall-core/Cargo.toml "$(cargo_version crates/newhall-core/Cargo.toml)"
          check crates/newhall-cli/Cargo.toml "$(cargo_version crates/newhall-cli/Cargo.toml)"
          check r-pkg/src/rust/Cargo.toml "$(cargo_version r-pkg/src/rust/Cargo.toml)"
          check r-pkg/DESCRIPTION "$(grep -m1 '^Version:' r-pkg/DESCRIPTION | sed -E 's/^Version:[[:space:]]*//' | tr -d '\r')"
          if [ "$status" -ne 0 ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match one or more package versions. Bump the versions or re-tag."
          fi
          exit "$status"

  cli-binaries:
    name: CLI Binary (${{ matrix.os }})
    needs: version-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release CLI
        run: cargo build --release -p newhall-cli

      - name: Package CLI binary
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          target="${{ matrix.os }}"
          case "$target" in
            ubuntu-latest) target=linux-x86_64 ;;
            macos-latest) target=macos-arm64 ;;
            windows-latest) target=windows-x86_64 ;;
          esac
          name="newhall-cli-v${version}-${target}"
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/newhall-cli.exe "dist/${name}.exe"
            (cd dist && 7z a "${name}.zip" "${name}.exe" >/dev/null && rm "${name}.exe")
          else
            cp target/release/newhall-cli "dist/${name}"
            tar -C dist -czf "dist/${name}.tar.gz" "${name}" && rm "dist/${name}"
          fi
          ls -l dist

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  r-source-tarball:
    name: R Source Tarball
    needs: version-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Build R source package
        run: R CMD build r-pkg

      - name: Upload R source tarball
        uses: actions/upload-artifact@v4
        with:
          name: r-source-tarball
          path: newhallrs_*.tar.gz
          if-no-files-found: error

  release:
    name: Attach Release Assets
    needs: [cli-binaries, r-source-tarball]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach assets to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
